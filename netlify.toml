# Netlify build configuration for the BlueSky landing page.
#
# The Next.js project lives in site/, not at the repository root, so `base`
# points there and every other path below is relative to it.
#
# Connecting this repository in the Netlify UI picks these settings up
# automatically — there is nothing to type into the build settings form.

[build]
  base = "site"
  command = "npm run build"
  publish = ".next"

# The Next.js runtime handles image optimisation and the static routes.
# Netlify usually detects it on its own; naming it here removes the doubt.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"

# Long-cache the fingerprinted build assets. Everything under /_next/static
# carries a content hash in its filename, so it can never go stale.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
